<style>:root{color-scheme:light}html,body{margin:0;padding:0}img{max-width:100%}</style>
<title>東京3D地理マップ</title>
<style>
  :root{
    --ink:#0f1115; --sub:#9aa0ad; --cardb:rgba(15,17,21,.08);
    --card:rgba(255,255,255,.82); --grid:#eef1f6; --water:#cfe4f5; --land:#f8f6ef;
    --ymt:#46b96a; --sob:#ff8a1e; --kei:#2aa8e0; --toy:#8a5a44; --mar:#e23a2e;
    --kk:#7b5cd6; --oda:#16a085; --dt:#d4a017; --fav:#ff3f87; --gnz:#cc7a29; --toz:#009bbf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  #wrap{position:fixed;inset:0;background:
    radial-gradient(135% 105% at 50% 20%, #ffffff 0%, #ffffff 58%, #eaeef5 100%);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
    color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  .hud{position:absolute;user-select:none;-webkit-user-select:none}
  .card{background:var(--card);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid var(--cardb);border-radius:16px;box-shadow:0 10px 34px rgba(20,24,40,.10)}
  #title{top:15px;left:17px;pointer-events:none}
  #title h1{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:7px}
  #title .v{font-size:10px;font-weight:700;color:#fff;background:var(--ink);padding:2px 6px;border-radius:6px}
  #title p{margin:5px 0 0;font-size:11px;color:var(--sub);font-weight:500}
  #legend{top:15px;right:14px;padding:9px 12px;display:grid;gap:4px}
  #legend .row{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:500;white-space:nowrap}
  #legend .sw{width:16px;height:4px;border-radius:3px;flex:0 0 auto}
  #legend .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px #fff;flex:0 0 auto}
  .lineRow{cursor:pointer;padding:3px 5px;margin:-3px -5px;border-radius:7px;transition:background .15s,opacity .15s}
  .lineRow:hover{background:rgba(15,17,21,.06)}
  .lineRow.active{background:rgba(15,17,21,.08);font-weight:700}
  .lineRow.dim{opacity:.32}
  #dock{left:50%;bottom:calc(15px + env(safe-area-inset-bottom));transform:translateX(-50%);
    width:min(660px,calc(100% - 22px));display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:7}
  #dock>*{pointer-events:auto}
  #quizbar{display:none;padding:13px 16px;flex-direction:column;gap:10px}
  #quizbar.show{display:flex}
  #q-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  #q-ask{font-size:12px;color:var(--sub);font-weight:600}
  #q-ask b{font-size:21px;color:var(--ink);font-weight:600;margin-left:5px}
  #q-ask b.miss{color:var(--fav)}
  #qscore{font-size:12px;color:var(--sub);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
  #q-trivia{font-size:12px;color:#5a6070;line-height:1.55;font-weight:500}
  #q-bottom{display:flex;align-items:center;gap:9px}
  #qfeedback{flex:1;font-size:13px;font-weight:600;min-height:18px}
  #infobar{display:none;padding:13px 16px;flex-direction:column;gap:6px}
  #infobar.show{display:flex}
  #i-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  #i-name{font-size:19px;font-weight:600;color:var(--ink)}
  #i-yomi{font-size:12px;color:var(--sub);font-weight:400}
  #q-yomi{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
  #i-trivia{font-size:12.5px;color:#5a6070;line-height:1.55;font-weight:500}
  #controls{display:flex;gap:8px;padding:8px;justify-content:center;flex-wrap:wrap}
  button{font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);background:#fff;
    border:1px solid var(--cardb);border-radius:11px;padding:10px 14px;cursor:pointer;
    transition:transform .05s,background .15s,color .15s,box-shadow .15s;box-shadow:0 1px 2px rgba(20,24,40,.05)}
  button:hover{box-shadow:0 3px 12px rgba(20,24,40,.12)}
  button:active{transform:translateY(1px)}
  button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* --- 凡例：折りたたみ式（モバイルで地図に被らない） --- */
  #leg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:12px;font-weight:700;cursor:pointer;padding:1px 2px}
  #leg-head .chev{transition:transform .18s;font-size:10px;color:var(--sub)}
  #legend.collapsed #leg-head .chev{transform:rotate(-90deg)}
  #leg-body{display:grid;gap:4px;margin-top:8px}
  #legend.collapsed #leg-body{display:none}
  #legend.collapsed{padding-bottom:9px}

  /* --- 右下：地図操作フローティング列（＋ − 📍 回転 視点） --- */
  /* bottom は #dock の実高さ（--dockh）に追従＝カードが伸びてもボタンが被らない */
  #mapctl{position:absolute;right:12px;display:flex;flex-direction:column;gap:8px;
    bottom:calc(var(--dockh,96px) + 27px + env(safe-area-inset-bottom));z-index:5}
  #mapctl button{width:46px;height:46px;padding:0;border-radius:14px;font-size:20px;
    display:flex;align-items:center;justify-content:center;line-height:1}
  #mapctl button.zoom{font-size:24px;font-weight:400}
  #mapctl #btn-locate.on{background:#1a73e8;color:#fff;border-color:#1a73e8}
  #mapctl #btn-locate.searching{animation:locpulse 1s ease-in-out infinite}
  @keyframes locpulse{0%,100%{opacity:1}50%{opacity:.45}}
  #geohint{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(var(--dockh,96px) + 27px + env(safe-area-inset-bottom));
    background:rgba(15,17,21,.9);color:#fff;font-size:12px;font-weight:600;
    padding:9px 14px;border-radius:12px;max-width:82%;text-align:center;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:6}
  #geohint.show{opacity:1}

  .triv-card{display:flex;gap:12px;align-items:flex-start}
  .triv-hero{flex:0 0 auto;width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    font-size:28px;box-shadow:inset 0 0 0 1px rgba(15,17,21,.06)}
  .triv-hero.cat-history{background:linear-gradient(150deg,#fde9c8,#f7d9a3)}
  .triv-hero.cat-culture{background:linear-gradient(150deg,#e8dcf7,#d7c3f0)}
  .triv-hero.cat-nature{background:linear-gradient(150deg,#dcf3df,#bfe8c8)}
  .triv-hero.cat-food{background:linear-gradient(150deg,#ffe1d6,#ffc7b3)}
  .triv-hero.cat-urban{background:linear-gradient(150deg,#dbeafe,#bcd8fb)}
  .triv-hero.cat-transit{background:linear-gradient(150deg,#d8f0f2,#b6e2e6)}
  .triv-hero.cat-now{background:linear-gradient(150deg,#ffe9d1,#ffcfa4)}
  .triv-facts{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
  .triv-row{display:flex;gap:7px;font-size:12px;line-height:1.6;color:#3a3d45}
  /* align-self が無いと flex の既定(stretch)でタグの色ボックスが行の高さまで伸びる */
  .triv-tag{flex:0 0 auto;align-self:flex-start;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap;margin-top:1px}
  .triv-tag.hist{background:#fdeccb;color:#9a6a12}
  .triv-tag.near{background:#dcecff;color:#1f5fb0}
  .triv-tag.fun{background:#ffe0ee;color:#c23070}
  .triv-tag.now{background:#ffe3cc;color:#b35c12}
  .triv-empty{font-size:12.5px;color:#8a8f9a;padding:4px 0}
  @media(max-width:560px){
    #title h1{font-size:14px} #title p{display:none}
    #legend{top:12px;right:9px;padding:7px 9px;gap:3px} #legend .row{font-size:10px}
    #controls button{flex:1;min-width:0;padding:11px 5px;font-size:12px} #q-ask b{font-size:19px}
    .triv-hero{width:44px;height:44px;font-size:22px;border-radius:12px}
    /* スマホは操作ボタンを右上（凡例の下）に固定＝下のカードと絶対に取り合わない */
    #mapctl{flex-flow:row wrap;justify-content:flex-end;width:97px;gap:7px;
      top:58px;bottom:auto}
    #mapctl button{width:45px;height:45px;border-radius:13px;font-size:19px}
    #legend{z-index:6}  /* 凡例を開いたときはボタンより手前に */
    /* カードが画面を占領しないよう高さを制限してスクロールさせる */
    #infobar,#quizbar{padding:12px 13px}
    #i-name{font-size:17px}
    #i-trivia,#q-trivia{max-height:38vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    /* 狭い画面はタグを文字の上に積む＝本文が全幅使えて行間も取れる */
    .triv-card{gap:11px}
    .triv-facts{gap:12px}
    .triv-row{flex-direction:column;gap:4px;font-size:12.5px;line-height:1.75}
    .triv-tag{font-size:10px;padding:2px 7px;margin-top:0}
  }
</style>
</head>

<div id="wrap">
  <canvas id="c"></canvas>
  <div class="hud" id="title">
    <h1>東京・神奈川 3D 地理マップ <span class="v">v5</span></h1>
    <p>ドラッグ移動 ・ ピンチ/＋−で拡大 ・ 📍で現在地 ・ 🗺️で表参道へ ・ 🔄で3D回転</p>
  </div>
  <div class="hud card" id="legend">
    <div id="leg-head"><span>🚃 路線・凡例</span><span class="chev">▾</span></div>
    <div id="leg-body">
    <div class="row lineRow" data-line="ymt"><span class="sw" style="background:var(--ymt)"></span>山手線</div>
    <div class="row lineRow" data-line="sob"><span class="sw" style="background:var(--sob)"></span>中央・総武線</div>
    <div class="row lineRow" data-line="kei"><span class="sw" style="background:var(--kei)"></span>京浜東北・根岸線</div>
    <div class="row lineRow" data-line="toy"><span class="sw" style="background:var(--toy)"></span>東急東横線</div>
    <div class="row lineRow" data-line="mar"><span class="sw" style="background:var(--mar)"></span>丸ノ内線</div>
    <div class="row lineRow" data-line="kk"><span class="sw" style="background:var(--kk)"></span>京急本線</div>
    <div class="row lineRow" data-line="oda"><span class="sw" style="background:var(--oda)"></span>小田急小田原線</div>
    <div class="row lineRow" data-line="dt"><span class="sw" style="background:var(--dt)"></span>田園都市線</div>
    <div class="row lineRow" data-line="gnz"><span class="sw" style="background:var(--gnz)"></span>銀座線</div>
    <div class="row lineRow" data-line="toz"><span class="sw" style="background:var(--toz)"></span>東西線</div>
    <div class="row"><span class="dot" style="background:var(--fav)"></span>お気に入り</div>
    <div class="row"><span class="dot" style="background:#1a73e8"></span>現在地</div>
    <div class="row">🗺️ 街ネタ（拡大すると出る）</div>
    </div>
  </div>
  <div id="geohint"></div>
  <div class="hud" id="mapctl">
    <button id="btn-zin" class="zoom" aria-label="拡大">＋</button>
    <button id="btn-zout" class="zoom" aria-label="縮小">−</button>
    <button id="btn-locate" aria-label="現在地">📍</button>
    <button id="btn-omote" aria-label="表参道へ">🗺️</button>
    <button id="btn-rotate2" aria-label="回転">🔄</button>
    <button id="btn-reset2" aria-label="視点リセット">↺</button>
  </div>
  <div class="hud" id="dock">
    <div class="card" id="quizbar">
      <div id="q-top"><div id="q-ask">この駅はどこ？<b id="q-name">—</b><span id="q-yomi"></span></div><div id="qscore">0 / 0</div></div>
      <div id="q-trivia"></div>
      <div id="q-bottom"><div id="qfeedback"></div><button id="qskip">スキップ</button><button id="qend">やめる</button></div>
    </div>
    <div class="card" id="infobar">
      <div id="i-head"><span id="i-name">駅をタップしてね</span><span id="i-yomi"></span></div>
      <div id="i-trivia">気になる駅を押すと、その街の特徴・歴史が出るよ。</div>
    </div>
    <div class="card" id="controls">
      <button id="mode-look" class="on">👀 見る</button>
      <button id="mode-trivia">💡 豆知識</button>
      <button id="mode-quiz">🎯 クイズ</button>
      <button id="btn-labels" class="on">🏷️ 駅名</button>
    </div>
  </div>
</div>

  function placeLabel(t,x,y,col,placed,fs){
    ctx.font='500 '+(fs||12.5)+'px -apple-system,"Hiragino Sans",sans-serif';
    const w=ctx.measureText(t).width,bw=w+12;
    // 画面端で文字が切れないよう内側に寄せる
    const bx=Math.max(4,Math.min(x-bw/2,W-bw-4));
    const rect={x:bx,y:y-12,w:bw,h:17};
    for(const r of placed){if(rect.x<r.x+r.w&&rect.x+rect.w>r.x&&rect.y<r.y+r.h&&rect.y+rect.h>r.y)return}

  function pick(mx,my){let best=null,bd=17;
    allStations.forEach(n=>{const p=project(n.x,RAIL,n.z),d=Math.hypot(p.sx-mx,p.sy-my);if(d<bd){bd=d;best=n}});

      const p=project(n.x,SPOTY,n.z),d=Math.hypot(p.sx-mx,p.sy-my);if(d<bd){bd=d;best=n}});
    return best}

  let lx,ly,moved=0,pointers=new Map(),pinchD=0,midX=0,midY=0,rotateMode=false,multi=false;
  c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    lx=e.clientX;ly=e.clientY;
    // moved のリセットは1本目だけ。2本目で 0 に戻すとピンチがタップ扱いされる
    if(pointers.size===1){moved=0;multi=false}
    if(pointers.size>=2){multi=true;const p=[...pointers.values()];pinchD=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);

      const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
      const mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;
      if(pinchD){
        // 指の中心にあった地点が、新しい指の中心にそのまま来るように拡大＋移動する
        const k=Math.max(4,Math.min(600,zoom*d/pinchD))/zoom;
        panx=mx-cx-(midX-cx-panx)*k;
        pany=my-cy+(cy+pany-midY)*k;
        zoom=zoom*k;
      }
      pinchD=d;midX=mx;midY=my;moved+=5;draw();return;
    }
    if(pointers.size===1){
      const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);

    if(pointers.size===1){const q=[...pointers.values()][0];lx=q.x;ly=q.y}

は昔ながらの下町散歩コースとして人気。"},"鶯谷":{"icon":"🐦","cat":"nature","history":"名前の通り、江戸時代は鶯の鳴き声が聞こえる閑静な地として知られた。","nearby":"上野公園の北側、寛永寺、子規庵（正岡子規の旧居）が近い。","fun":"山手線の中で最も利用者数が少ない駅で、1日の乗降客数は新宿の1%以下。"},"上野":{"icon":"🐼","cat":"culture","history":"1883年開業、東北・北陸方面への玄関口として「北の玄関口」と呼ばれてきた。","nearby":"上野動物園（パンダ）、国立西洋美術館、アメ横商店街が徒歩圏。","fun":"上野動物園のパンダは日本に初めて来た1972年のパンダの子孫で、今も一番人気。"},"御徒町":{"icon":"💎","cat":"history","history":"江戸時代、徒歩で将軍を警護する「御徒（おかち）」の武士たちが住んだ地。","nearby":"アメ横商店街の南側、宝石・貴金属の問屋街が広がる。","fun":"問屋街価格で買えるため、ジュエリー好きの間では「日本の宝石の街」として知られる。"},"秋葉原":{"icon":"🎮","cat":"culture","history":"戦後の闇市から電気部品街として発展、1990年代からアニメ・ゲーム文化の街へ。","nearby":"メイドカフェ、フィギュア専門店、電気部品の老舗が密集する。","fun":"世界中から「オタク文化の聖地」として観光客が訪れ、英語でも“Akiba”で通じる。"},"神田":{"icon":"📖","cat":"culture","history":"神田明神の門前町として発展。隣接する神保町は世界最大級の古書店街。","nearby":"神田古書店街、皇居の東側、サラリーマンの街の飲食店街。","fun":"神田カレー街と呼ばれるほどカレー店の激戦区で、毎年カレーグランプリが開催される。"},"吉祥寺":{"icon":"🌳","cat":"nature","history":"江戸の大火で焼け出された住民が移住して開いた町で、地名は移住元の寺の名から。","nearby":"井の頭恩賜公園、ハーモニカ横丁、吉祥寺サンロード商店街。","fun":"「住みたい街ランキング」で全国トップ常連。井の頭公園には手漕ぎボートもある。"},"荻窪":{"icon":"🍜","cat":"food","history":"江戸時代からの甲州街道の宿場町。戦後、ラーメン店が集積し名物になった。","nearby":"荻窪白山神社、レトロな商店街、ラーメン店が徒歩圏に密集。","fun":"「荻窪ラーメン」というジャンル名があるほど、全国的にラーメンの街として知られる。"},"阿佐ケ谷":{"icon":"🎋","cat":"culture","history":"中央線文化を代表する街のひとつで、昭和から続く商店街の雰囲気が今も残る。","nearby":"阿佐谷パールセンター商店街、個性的な個人経営の飲食店が並ぶ。","fun":"毎年8月の「阿佐谷七夕まつり」は60年以上の歴史があり、巨大な七夕飾りが街を彩る。"},"高円寺":{"icon":"🎸","cat":"culture","history":"戦後、演劇・音楽好きが集まり独自のカルチャーが根付いた「中央線文化」の中心地。","nearby":"古着屋が密集する高円寺純情商店街、ライブハウスが点在するエリア。","fun":"毎年8月の「東京高円寺阿波おどり」には100万人以上が訪れ、東京屈指の規模を誇る。"},"中野":{"icon":"🕹️","cat":"culture","history":"かつて江戸幕府の「生類憐みの令」で犬を保護する巨大な施設があった土地。","nearby":"サブカルの殿堂「中野ブロードウェイ」、中野サンモール商店街。","fun":"中野ブロードウェイにはフィギュア・古着・古書の専門店が数百軒集まり、一日中歩き回れる。"},"錦糸町":{"icon":"🗼","cat":"urban","history":"かつて花街として栄え、戦後は下町の繁華街として発展した。","nearby":"東京スカイツリー、江戸東京博物館（両国方面）まで一駅圏内。","fun":"スカイツリーが見える駅としても知られ、夜は特にライトアップが美しく映える。"},"四ツ谷":{"icon":"⛪","cat":"history","history":"江戸城の外堀に位置し、江戸時代は四つの街道が交わる交通の要衝だった。","nearby":"上智大学、迎賓館赤坂離宮、皇居外堀の緑道。","fun":"駅のホームから江戸城の名残である外堀の土手と桜並木を電車内から眺められる。"},"御茶ノ水":{"icon":"🎸","cat":"culture","history":"徳川将軍にお茶の水を献上した名水の井戸がこの地にあったことが駅名の由来。","nearby":"楽器店街、湯島聖堂、神田川に架かる聖橋の美しい景観。","fun":"大学が密集し「日本のカルチェ・ラタン」と呼ばれるほどの学生街になっている。"},"両国":{"icon":"🤼","cat":"culture","history":"江戸時代から相撲興行の中心地で、両国国技館は大相撲の聖地として知られる。","nearby":"江戸東京博物館、すみだ北斎美術館、ちゃんこ鍋の名店街。","fun":"本場所の時期は、まわし姿の力士が街を歩く姿を実際に見かけることもある。"},"大井町":{"icon":"🚉","cat":"urban","history":"江戸時代は東海道の立場（休憩所）として栄えた地。","nearby":"りんかい線・東急大井町線が交わる乗換駅で、庶民的な商店街が広がる。","fun":"駅前にはボウリング場やゲームセンターが集まり、下町らしい懐かしい娯楽の街。"},"大森":{"icon":"🐚","cat":"history","history":"1877年、アメリカ人モースが日本考古学発祥の地とされる「大森貝塚」を発見した。","nearby":"大森貝塚遺跡庭園、かつて海苔養殖で栄えた海側のエリア。","fun":"大森貝塚の発見は日本考古学の始まりとされ、駅前に記念碑が今も残る。"},"蒲田":{"icon":"🥟","cat":"food","history":"戦前は松竹・日活の撮影所があり「日本のハリウッド」と呼ばれた映画の街だった。","nearby":"羽田空港へのアクセス至便、黒湯温泉の銭湯、餃子の名店街。","fun":"「羽根つき餃子」発祥の店があるなど、餃子の街として全国的に有名。"},"川崎":{"icon":"🏭","cat":"urban","history":"江戸時代は東海道の宿場「川崎宿」。明治以降は京浜工業地帯の中心として発展した。","nearby":"ラゾーナ川崎、チネチッタ、工場夜景クルーズの発着地。","fun":"工場夜景は「日本三大工場夜景」のひとつに数えられ、専用クルーズ船まで運航している。"},"鶴見":{"icon":"🌎","cat":"culture","history":"明治以降、工業地帯として発展する中で南米・沖縄からの移民が多く移り住んだ。","nearby":"沖縄タウンと呼ばれる商店街、多国籍な食文化が根付くエリア。","fun":"ブラジル・ペルー料理店から沖縄そば屋まで並ぶ、日本一多国籍と言われる商店街がある。"},"東神奈川":{"icon":"🚉","cat":"transit","history":"横浜開港以前からの古い地名「神奈川」を今に伝える駅名。","nearby":"京急仲木戸駅と隣接し、乗換に便利な立地。","fun":"「神奈川県」という県名の由来になった地名がこの駅名に残っている。"},"横浜":{"icon":"⚓","cat":"history","history":"1859年に開港した日本を代表する国際貿易港。文明開化の象徴的な街。","nearby":"みなとみらい、横浜中華街、赤レンガ倉庫まで一駅圏内。","fun":"日本初のアイスクリーム・牛鍋・ビールなど「日本初」の食文化が数多く横浜発祥。"},"桜木町":{"icon":"🎡","cat":"history","history":"1872年、日本初の鉄道開業時の「初代横浜駅」があった鉄道発祥の地のひとつ。","nearby":"よこはまコスモワールドの観覧車、ランドマークタワー、汽車道の遊歩道。","fun":"横浜の観覧車「コスモクロック21」は時計付き観覧車として世界最大級だった。"},"関内":{"icon":"⚾","cat":"history","history":"開港当時、外国人居留地と日本人街を分けた関所「関門」の内側だったことが駅名の由来。","nearby":"横浜スタジアム、横浜三塔（キング・クイーン・ジャック）と呼ばれる歴史的建造物。","fun":"横浜スタジアムでのDeNAベイスターズ戦の日は、駅前が青いユニフォームで埋まる。"},"石川町":{"icon":"🏮","cat":"culture","history":"開港後、外国人居留地の南側に位置し、山手の西洋館文化が発展した地域。","nearby":"横浜中華街、元町ショッピングストリート、山手の洋館群が徒歩圏。","fun":"駅から中華街まで徒歩数分。食べ歩きグルメの種類は数百種類とも言われる。"},"中目黒":{"icon":"🌸","cat":"nature","history":"目黒川沿いは大正時代から桜並木が植えられ、地域の憩いの場として親しまれてきた。","nearby":"目黒川沿いのおしゃれなカフェ・雑貨店、代官山まで散歩圏。","fun":"春の桜シーズンは川面がピンクの花びらで埋め尽くされ、夜桜ライトアップも人気。"},"自由が丘":{"icon":"🍰","cat":"food","history":"1927年開業当初は「九品仏駅」だったが、後に「自由ヶ丘学園」にちなみ改称された。","nearby":"スイーツの名店が密集するモンブラン通り、女神像のある広場。","fun":"日本のモンブラン発祥店といわれる名店があり、スイーツ激戦区として知られる。"},"武蔵小杉":{"icon":"🏙️","cat":"urban","history":"かつては工場地帯だったが、2000年代の再開発でタワーマンション街へ変貌した。","nearby":"JR横須賀線・南武線・東急東横線が交わる、川崎市随一の交通結節点。","fun":"急激な人口増加で「タワマン都市」の代表格として全国的に注目された街。"},"銀座":{"icon":"💍","cat":"urban","history":"江戸時代に銀貨を鋳造する「銀座役所」があったことが地名の由来。","nearby":"歩行者天国の中央通り、老舗百貨店、歌舞伎座が徒歩圏。","fun":"1丁目あたりの土地は日本一の高額地価で知られる、一等地中の一等地。"},"赤坂見附":{"icon":"🏛️","cat":"history","history":"江戸城の外堀に設けられた見張り所「見附」があったことが地名の由来。","nearby":"国会議事堂・首相官邸のある永田町、老舗料亭街の赤坂。","fun":"政治の中心地に近く、駅周辺には要人を乗せた車列を見かけることもある。"},"後楽園":{"icon":"🎢","cat":"culture","history":"水戸徳川家の庭園「小石川後楽園」が地名の由来。江戸時代からの名園が今も残る。","nearby":"東京ドーム、遊園地「東京ドームシティアトラクションズ」、スパラクーア。","fun":"野球・コンサート・遊園地・庭園散策が一駅で全部楽しめる珍しいエリア。"},"京急蒲田":{"icon":"✈️","cat":"transit","history":"京急空港線が分岐する駅として、羽田空港アクセスの要になってきた。","nearby":"羽田空港まで一本、蒲田の商店街や銭湯文化も近い。","fun":"複雑な線路配置を解消するため、高架化・大規模改良工事が長年続けられた駅として知られる。"},"上大岡":{"icon":"🏬","cat":"urban","history":"かつては農村地帯だったが、京急の開発で港南区随一の商業拠点へ発展した。","nearby":"駅直結の百貨店・ショッピングモール、京急百貨店。","fun":"横浜市南部エリアの中では有数の賑わいを誇り「南の副都心」とも呼ばれる。"},"金沢文庫":{"icon":"📜","cat":"history","history":"鎌倉時代、北条実時が創設した日本最古級の武家文庫「金沢文庫」が地名の由来。","nearby":"称名寺、県立金沢文庫（史跡・美術館）が駅から徒歩圏。","fun":"創設は13世紀。今も貴重な古文書を保存・展示する文化施設として現役で機能している。"},"横須賀中央":{"icon":"⚓","cat":"history","history":"明治以降、日本海軍の拠点として発展した軍港都市の中心駅。","nearby":"どぶ板通り、三笠公園（戦艦三笠が保存）、米軍基地。","fun":"名物「海軍カレー」は当時の海軍レシピを再現したもので、街のあちこちで味わえる。"},"浦賀":{"icon":"⛴️","cat":"history","history":"1853年、ペリー率いる黒船が来航し、日本開国のきっかけとなった歴史的な港。","nearby":"浦賀ドック跡、渡し船（浦賀の渡し）が今も運航する港町の風情。","fun":"駅前の港では、今も小さな渡し船が対岸まで住民を運ぶ現役の交通手段になっている。"},"下北沢":{"icon":"🎭","cat":"culture","history":"戦後、演劇人が集まり小劇場文化が根付いた「シモキタ」ことサブカルの聖地。","nearby":"古着屋が密集する路地、小劇場、ライブハウスが徒歩圏に密集。","fun":"人口に対する古着屋・劇場の密度が都内トップクラスで、路地裏散策が定番の楽しみ方。"},"登戸":{"icon":"🎥","cat":"culture","history":"多摩川の渡し場として栄えた宿場町が起源。","nearby":"藤子・F・不二雄ミュージアム、多摩川の土手、生田緑地。","fun":"ドラえもんの生みの親ゆかりの地で、駅から専用バスでミュージアムへ行ける。"},"町田":{"icon":"🛍️","cat":"urban","history":"東京都でありながら神奈川県に大きく食い込む珍しい地形で、古くから交通の要衝だった。","nearby":"町田駅前の一大商業エリア、多摩丘陵の自然。","fun":"「東京都なのに神奈川県民に大人気」という独特のポジションで、若者が集まる商業都市になった。"},"本厚木":{"icon":"⛰️","cat":"nature","history":"江戸時代から大山詣での宿場町として栄え、今も参拝客の玄関口。","nearby":"大山・丹沢山地への登山口、厚木シロコロホルモンの飲食店街。","fun":"名物「シロコロホルモン」は白くコロコロした厚木名物のホルモン焼きで、B級グルメで有名になった。"},"秦野":{"icon":"💧","cat":"nature","history":"かつてたばこ産業（葉タバコ）で栄えた盆地の町。","nearby":"名水100選の秦野盆地湧水群、丹沢・大山への登山口。","fun":"市内の湧水は環境省の「名水百選」に選ばれるほど清らかで、今も生活用水として使われている。"},"小田原":{"icon":"🏯","cat":"history","history":"戦国時代、北条氏が本拠地とした小田原城は難攻不落の城として知られた。","nearby":"小田原城址公園、箱根登山鉄道への乗換口、干物・かまぼこの店が並ぶ。","fun":"豊臣秀吉の小田原征伐では、20万の大軍を相手に籠城戦を耐え抜いた歴史を持つ。"},"二子玉川":{"icon":"🌊","cat":"nature","history":"多摩川の渡し場として栄え、大正〜昭和には遊園地もあった行楽地だった。","nearby":"多摩川河川敷、二子玉川ライズという大型複合施設。","fun":"「ニコタマ」の愛称で親しまれ、都心にいながら川辺でピクニックができる贅沢なロケーション。"},"溝の口":{"icon":"🚉","cat":"transit","history":"大山街道の宿場町として栄えた歴史を持つ、川崎市高津区の中心地。","nearby":"JR南武線と東急田園都市線が交わる乗換駅、商店街が駅周辺に密集。","fun":"隣の二子新地・二子玉川と合わせて発展してきた、賑わいのあるエリア。"},"たまプラーザ":{"icon":"🏡","cat":"urban","history":"1966年、東急が多摩丘陵を開発した「多摩田園都市」構想の中心地として誕生した街。","nearby":"緑豊かな住宅街、東急百貨店たまプラーザ店。","fun":"駅名の「プラーザ」はスペイン語の広場（Plaza）に由来し、開発当時の洋風な街づくりを象徴する。"},"長津田":{"icon":"🚃","cat":"transit","history":"江戸時代は大山街道の宿場町。現在は複数路線が交わる鉄道の要衝。","nearby":"こどもの国線の乗換駅、横浜市緑区の郊外住宅地。","fun":"「こどもの国線」は東急がこどもの国への足として作った珍しい支線で、朝夕以外は本数が少ない。"},"中央林間":{"icon":"🌊","cat":"transit","history":"かつて大和市の原野だったが、鉄道開通とともに住宅地として発展した。","nearby":"東急田園都市線・小田急江ノ島線の乗換駅で、江の島方面へも一本。","fun":"ここから小田急に乗り換えれば、海のある江の島まで乗り換えなしで行ける便利な駅。"},"表参道":{"icon":"🌳","cat":"history","history":"1938年に「青山六丁目」として開業→青山○丁目駅が続いて降り間違いが多発し1939年「神宮前」へ→1972年の千代田線開業で「表参道」に改称。","nearby":"表参道ヒルズ、東急プラザ表参道オモカド、キャットストリート、明治神宮まで全部徒歩圏。青山通りとの表参道交差点が道の起点。","fun":"1972年に役目を終えた旧「神宮前駅」のホームが今も地下に残っていて、銀座線の車内から見える。2017年の地下鉄90周年ではライトアップされた。"},"青山一丁目":{"icon":"🌿","cat":"history","history":"1590年、徳川家康の小姓・青山忠成が屋敷地を拝領したのが「青山」の由来。馬で駆け回った範囲を与えられたという逸話が伝わる。","nearby":"明治神宮外苑、青山霊園、赤坂御用地。オフィスと緑が混ざる落ち着いたエリア。","fun":"銀座線・半蔵門線・大江戸線が交わる乗換駅。青山通り沿いを表参道までまっすぐ歩ける。"},"日本橋":{"icon":"🌉","cat":"history","history":"1603年に架けられた日本橋は五街道の起点。橋の中央に道路の起点を示す「日本国道路元標」が埋め込まれている。","nearby":"三越本店、老舗の和菓子屋・刃物店、東京証券取引所のある兜町まで徒歩圏。","fun":"全国の国道の「東京から○km」という距離表示は、すべてこの日本橋を0kmとして測られている。"},"浅草":{"icon":"🏮","cat":"culture","history":"628年創建と伝わる浅草寺の門前町として発展し、江戸随一の繁華街として賑わった。","nearby":"浅草寺・雷門、仲見世商店街、隅田川の遊歩道。対岸にスカイツリー。","fun":"1927年、上野〜浅草間に日本初の地下鉄（今の銀座線）が開業した。銀座線はここが終点。"}};

  function renderTrivia(t){
    if(!t)return '<div class="triv-empty">💡 この駅の情報は準備中だよ</div>';
    return '<div class="triv-card"><div class="triv-hero cat-'+t.cat+'">'+t.icon+'</div>'
      +'<div class="triv-facts">'
      +'<div class="triv-row"><span class="triv-tag hist">📜歴史</span><span>'+t.history+'</span></div>'
      +'<div class="triv-row"><span class="triv-tag near">📍まわりには</span><span>'+t.nearby+'</span></div>'
      +'<div class="triv-row"><span class="triv-tag fun">✨豆知識</span><span>'+t.fun+'</span></div>'
      +(t.now?'<div class="triv-row"><span class="triv-tag now">🆕時事</span><span>'+t.now+'</span></div>':'')
      +'</div></div>';
  }
  function nextQ(){qfb.textContent='';qName.classList.remove('miss');
    qCur=quizPool[Math.floor(Math.random()*quizPool.length)];qName.textContent=qCur;
    qYomi.textContent=YOMI[qCur]?('（'+YOMI[qCur]+'）'):'';
    qtr.innerHTML=renderTrivia(TRIVIA[qCur])}
  function answer(n){qTotal++;
    if(n.name===qCur){qScore++;qfb.textContent='⭕ 正解！';qfb.style.color='#1f9d57';setTimeout(nextQ,650)}
    else{qfb.textContent='❌ そこは「'+n.name+'」';qfb.style.color='#e23b6d';
      qName.classList.add('miss');hover=nodes.get(qCur);showLabels=true;draw();
      setTimeout(()=>{nextQ();hover=null;draw()},1200)}
    qsc.textContent=qScore+' / '+qTotal;draw();}

  // --- 現在地（GPS）---
  const bLoc=document.getElementById('btn-locate'),gh=document.getElementById('geohint');
  let ghT=0,geoId=null,firstFix=true;
  function hint(msg,ms){clearTimeout(ghT);gh.textContent=msg;gh.classList.add('show');
    if(ms)ghT=setTimeout(()=>gh.classList.remove('show'),ms);}
  function centerOn(x,z){const r=rot(x,FAVY,z);panx=-r.hx*zoom;pany=r.vy*zoom-H*0.10;}
  function pulse(){if(!(geoOn&&myPos)){rafId=0;return;}pulseT+=0.12;draw();rafId=requestAnimationFrame(pulse);}
  function stopGeo(){if(geoId!=null){navigator.geolocation.clearWatch(geoId);geoId=null;}
    geoOn=false;myPos=null;bLoc.classList.remove('on','searching');
    if(rafId){cancelAnimationFrame(rafId);rafId=0;}draw();hint('現在地の表示をオフにしたよ',1600);}
  bLoc.onclick=()=>{
    if(geoOn){stopGeo();return;}
    if(!navigator.geolocation){hint('この端末は位置情報に対応してないみたい',2600);return;}
    bLoc.classList.add('searching');hint('現在地を探してるよ…',0);firstFix=true;
    geoId=navigator.geolocation.watchPosition(pos=>{
      const la=pos.coords.latitude,lo=pos.coords.longitude,q=toXZ(la,lo);
      myPos={x:q.x,z:q.z};geoOn=true;
      bLoc.classList.remove('searching');bLoc.classList.add('on');
      if(firstFix){firstFix=false;
        if(la<33||la>37.5||lo<136.5||lo>141.5){
          hint('いまの現在地は地図の範囲外みたい（東京・神奈川マップだよ）',3600);
        }else{zoom=Math.max(zoom,95);centerOn(myPos.x,myPos.z);
          hint('現在地を表示中📍 もう一度押すとオフ',2400);}
        if(!rafId)rafId=requestAnimationFrame(pulse);
      }
      draw();
    },err=>{
      bLoc.classList.remove('searching','on');geoOn=false;
      const m=err.code===1?'位置情報がブロックされてるみたい。設定 → Safari → 位置情報を「許可」にしてね'
        :'現在地を取得できなかった…電波のいい所でもう一度試してみて';
      hint(m,4200);
    },{enableHighAccuracy:true,maximumAge:5000,timeout:12000});
  };

  // --- 下部カードの実高さを --dockh に反映（操作ボタン・ヒントが被らないように）---
  const dockEl=document.getElementById('dock');
  function setDockH(){document.documentElement.style.setProperty('--dockh',dockEl.offsetHeight+'px')}
  if(window.ResizeObserver)new ResizeObserver(setDockH).observe(dockEl);
  addEventListener('resize',setDockH);setDockH();

  // --- 🗺️ 表参道へ飛ぶ（街ネタピンが出るズームまで寄る）---
  document.getElementById('btn-omote').onclick=()=>{
    let a=1e9,b=-1e9,d=1e9,e=-1e9;
    spotNodes.forEach(n=>{const r=rot(n.x,SPOTY,n.z);
      if(r.hx<a)a=r.hx;if(r.hx>b)b=r.hx;if(r.vy<d)d=r.vy;if(r.vy>e)e=r.vy});
    const rw=(b-a)||1,rh=(e-d)||1,mob=W<560;
    // カードが占める下側を除いた「見える帯」の中にピンを収める
    const reserve=mob?H*0.56:(dockEl.offsetHeight||120)+34;
    // mob は右上の操作ボタン列を避けて少し下から始める
    const top=mob?104:74, bot=Math.max(top+140,H-reserve);
    zoom=Math.max(SPOTZ+10,Math.min(600,Math.min((W*(mob?0.78:0.58))/rw,((bot-top)*0.84)/rh)));
    panx=-((a+b)/2)*zoom;pany=((d+e)/2)*zoom+((top+bot)/2-cy);
    if(mode!=='trivia')setMode('trivia');else draw();
    hint('表参道だよ🗺️ ピンを押すと街ネタが出る',3000);
  };

  document.querySelectorAll('.lineRow').forEach(row=>{
    row.addEventListener('click',()=>{
      const key=row.dataset.line;
      activeLine=activeLine===key?null:key;
      document.querySelectorAll('.lineRow').forEach(r=>{
        r.classList.toggle('active',r.dataset.line===activeLine);
        r.classList.toggle('dim',!!activeLine&&r.dataset.line!==activeLine);
      });
      draw();
    });
  });

  const legend=document.getElementById('legend'),legHead=document.getElementById('leg-head');
  legHead.addEventListener('click',()=>legend.classList.toggle('collapsed'));
  if(innerWidth<560)legend.classList.add('collapsed');

  window.addEventListener('resize',resize);resize();
})();
</script>

</body></html>
